name: Test Local
on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: test-local-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-local:
    name: Test (${{ matrix.target }})
    strategy:
      fail-fast: false
      # Both runners are on one Mac mini. OrbStack's machines.forward_ports is off there, so the
      # fixed ports the tests listen on in the Linux VM don't collide with the macOS job's.
      matrix:
        include:
          - target: linux-arm64
            runs-on: [self-hosted, Linux, ARM64]
          - target: darwin-arm64
            runs-on: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.runs-on }}
    env:
      # the runners are in china, so go modules they don't have yet come from goproxy.cn
      GOPROXY: https://goproxy.cn,direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      # The runners keep their disks, so the go, cargo and ccache caches and the model file stay on
      # them, outside the workspace that checkout cleans. Through the github cache they took minutes
      # to download from the mini.
      - name: Local caches
        run: |
          dir="$HOME/.cache/nature-ci"
          mkdir -p "$dir/ccache"
          echo "NATURE_CI_CACHE=$dir" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$dir/ccache" >> "$GITHUB_ENV"

      - name: Setup Go for package
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Rust for nls
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Test NLS
        working-directory: nls
        env:
          NATURE_ROOT: ${{ github.workspace }}
        run: CARGO_TARGET_DIR="$NATURE_CI_CACHE/nls-target" cargo test --all --locked

      - name: Setup Musl for Linux
        if: ${{ contains(matrix.target, 'linux') }}
        run: sudo apt-get install -y musl-tools

      - name: LLaMA model file
        run: |
          model="$NATURE_CI_CACHE/stories15M.bin"
          if [ ! -f "$model" ]; then
            echo "Downloading stories15M.bin model file..."
            wget -O "$model.tmp" https://huggingface.co/karpathy/tinyllamas/resolve/main/stories15M.bin
            mv "$model.tmp" "$model"
          fi
          cp "$model" tests/features/cases/20250324_00_llama/stories15M.bin

      - name: Set job parallelism
        id: parallelism
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "j_flag=$(nproc)" >> "$GITHUB_OUTPUT"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "j_flag=$(sysctl -n hw.ncpu)" >> "$GITHUB_OUTPUT"
          else
            echo "j_flag=2" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Runtime
        uses: threeal/cmake-action@v2.1.0
        with:
          c-compiler: ${{ contains(matrix.target, 'linux') && 'musl-gcc' || 'clang' }}
          build-dir: build-runtime
          args: -S runtime
          options: |
            CMAKE_BUILD_TYPE=Debug
            CMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/${{ matrix.target }}-toolchain.cmake
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          build-args:
            --target runtime

      - name: Build Project
        uses: threeal/cmake-action@v2.1.0
        with:
          c-compiler: ${{ contains(matrix.target, 'linux') && 'musl-gcc' || 'clang' }}
          build-dir: build-release
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            CMAKE_VERBOSE_MAKEFILE=ON
            CPACK_OUTPUT_FILE_PREFIX=${{ github.workspace }}/release
            CMAKE_C_COMPILER_LAUNCHER=ccache
            CMAKE_CXX_COMPILER_LAUNCHER=ccache
          build-args:
            -- -j${{ steps.parallelism.outputs.j_flag }}

      - name: Test
        uses: threeal/ctest-action@v1.1.0
        with:
          test-dir: build-release/tests
          args: -E "20250424_00_parker" --timeout 80
